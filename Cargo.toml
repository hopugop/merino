[package]
name = "merino"
version = "0.1.3"
description = "A SOCKS5 Proxy server written in Rust"
repository = "https://github.com/hopugop/merino"
readme = "README.md"
license = "MIT"
authors = ["Avery Wagar <ajmw.subs@gmail.com>"]
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
actix = "0.13"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
log = "0.4.34"
pretty_env_logger = "0.5.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.147"
snafu = "0.9.2"
thiserror = "2.0.20"
# Only what the proxy actually uses: the actix multi-thread runtime, TCP/UDP
# sockets, the AsyncRead/Write helpers, the handshake and connect timeouts, the
# connection-cap semaphore, graceful-shutdown signals and `select!`.
# `tokio = "full"` also pulled in `fs`, `process` and more, none of which this
# crate touches.
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }

[dev-dependencies]
# Tests and benchmarks additionally spawn the binary and build a runtime by
# hand. Keeping these out of the main feature list means they are enabled for
# `cargo test` / `cargo bench` only, not for the shipped build.
tokio = { version = "1.53.1", features = ["process", "rt"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
proptest = "1.11.0"

[[bench]]
name = "proxy"
harness = false

[[bench]]
name = "parse"
harness = false
