name: Security

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - master
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  miri:
    name: Miri (pure unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: cargo +nightly miri test --lib -- --skip addr_to_socket

  fuzz:
    name: Fuzz smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Fuzz parse_greeting
        run: cargo +nightly fuzz run parse_greeting -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz parse_userpass
        run: cargo +nightly fuzz run parse_userpass -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz parse_request
        run: cargo +nightly fuzz run parse_request -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz pretty_print_addr
        run: cargo +nightly fuzz run pretty_print_addr -- -max_total_time=60 -rss_limit_mb=2048
